spring.application.name=empyra-backend

# ===============================
# === Database Configuration ===
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/EmpyraDB
spring.datasource.username=Essinaya
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

#Explanation:
#spring.datasource.url: Tells Spring how to connect to your PostgreSQL DB.
#localhost = your machine
#5432 = default Postgres port
#empyra_db = your database name
#username/password: Use the credentials of the Postgres user you created.
#driver-class-name: Specifies the JDBC driver Spring should use.


# =============================
# === Hibernate Settings ===
# =============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Explanation:
#ddl-auto=update: Automatically creates or updates tables based on your entity classes (during dev).
#show-sql=true: Prints generated SQL statements to the console for debugging.
#database-platform: Ensures Hibernate generates SQL compatible with PostgreSQL.


# =================================
# === SQL Init (for data.sql) ===
# =================================

spring.sql.init.mode=always

#Explanation:
#Ensures Spring runs data.sql or schema.sql at startup (if you add one later for seeding data).
